name: Pylint

on: [push, pull_request]

jobs:
  pylint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --dev

      - name: Cache Pylint data
        uses: actions/cache@v4
        with:
          path: ~/.cache/pylint
          key: ${{ runner.os }}-pylint-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-pylint-

     - run: uv run pylint -j 0 --disable=C0114,C0115,C0116,R0902,R0903,W0621 pages services models tests config.py conftest.py