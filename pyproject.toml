[project]
name = "qa-diplom-project"
version = "0.1.0"
description = "QA diploma project"
requires-python = ">=3.14"
dependencies = [
    "allure-pytest>=2.16.0",
    "faker>=40.23.0",
    "playwright>=1.60.0",
    "pydantic>=2.13.4",
    "pytest>=9.0.3",
    "pytest-playwright>=0.8.0",
    "requests>=2.34.2",
]
[tool.pytest.ini_options]
testpaths = [
    "tests",
]
pythonpath = [
    ".",
]
addopts = "-v"
base_url = "http://localhost:3000"
markers = [
    "smoke: быстрые тесты",
    "regression: регрессионные тесты",
    "login: тесты авторизации",
    "boards: тесты досок",
    "dashboard: тесты панели",
    "tasks: тесты задач",
    "logout: тесты выхода из системы",
    ]